[project]
name = "lc-bot"
version = "0.1.0"
description = "LangChain Docs Copilot: a multi-agent RAG assistant over the LangChain documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain v1 stack. Tested with langchain 1.4.7 and langchain-core 1.7.3.
    "langchain>=1.4.7,<1.5",
    "langchain[mcp]>=1.4.7,<1.5",
    "langchain-core>=1.7.3,<1.8",
    "langchain-classic>=1.0",          # CacheBackedEmbeddings
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary,pool]>=3.2",
    # Retrieval
    "langchain-qdrant>=1.1,<2",
    "qdrant-client>=1.15,<2",
    "fastembed>=0.7",                  # sparse BM25 vectors for hybrid search
    "langchain-text-splitters>=1.1",
    "pyyaml>=6",
    # Model providers (swap or add others via CHAT_MODEL / EMBEDDING_MODEL)
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    # Tools and MCP
    "langchain-tavily>=0.2",
    "fastmcp>=4.1,<5",
    # Serving
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.50",
    "httpx>=0.27",
    "redis>=5",
    "pydantic-settings>=2.5",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ui*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::langchain_core._api.beta_decorator.LangChainBetaWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the formatter wraps code; long docstring and prompt lines are fine.
# B008: FastAPI's `Depends(...)` in defaults is the documented pattern.
ignore = ["E501", "B008"]
